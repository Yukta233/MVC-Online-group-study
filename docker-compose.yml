version: '3.8'

services:
  # PHP Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: collabsphere-app
    container_name: collabsphere-app-container
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    volumes:
      - ./:/var/www
    networks:
      - collabsphere-network

  # Nginx Web Server Service
  webserver:
    image: nginx:alpine
    container_name: collabsphere-nginx-container
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - collabsphere-network

# Networks Definition
networks:
  collabsphere-network:
    driver: bridge
